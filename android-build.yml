.github/workflows/

name: Build Android APK & AAB (AquaSante DZ)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Organiser les fichiers automatiquement
        run: |
          mkdir -p src public
          [ -f App.jsx ] && cp App.jsx src/App.jsx || true
          [ -f main.jsx ] && cp main.jsx src/main.jsx || true
          [ -f index.css ] && cp index.css src/index.css || true
          [ -f privacy-policy.html ] && cp privacy-policy.html public/privacy-policy.html || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK & Release Bundle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Upload APK (Installable sur votre telephone)
        uses: actions/upload-artifact@v4
        with:
          name: AquaSante-DZ-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (Pour Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: AquaSante-DZ-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
